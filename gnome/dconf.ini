[desktop/interface]
accent-color='purple'
clock-format='24h'
clock-show-date=true
clock-show-seconds=true
clock-show-weekday=true
color-scheme='prefer-dark'
cursor-blink=true
cursor-blink-time=1000
cursor-size=24
cursor-theme='Windows-Aero'
document-font-name='Google Sans Flex 10'
enable-animations=true
enable-hot-corners=false
font-antialiasing='rgba'
font-hinting='slight'
font-name='Google Sans Flex 10'
gtk-theme='adw-gtk3-dark'
icon-theme='MoreWaita'
monospace-font-name='JetBrainsMono Nerd Font 10'
scaling-factor=uint32 1
show-battery-percentage=true
text-scaling-factor=1.0
toolbar-style='text'

[desktop/background]
color-shading-type='solid'
picture-options='zoom'

[desktop/screensaver]
picture-options='zoom'

[desktop/wm/preferences]
action-double-click-titlebar='toggle-maximize'
action-middle-click-titlebar='minimize'
button-layout='icon:minimize,maximize,close'
focus-mode='click'
num-workspaces=6
resize-with-right-button=true
titlebar-font='Google Sans Flex SemiBold 10'

[mutter]
center-new-windows=true
dynamic-workspaces=true
edge-tiling=true
experimental-features=['scale-monitor-framebuffer', 'xwayland-native-scaling']

[settings-daemon/plugins/media-keys]
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/']
home=['<Super>e']

[settings-daemon/plugins/media-keys/custom-keybindings/custom0]
binding='<Super>t'
command='kitty'
name='terminal'

[shell]
disable-extension-version-validation=false
enabled-extensions=['user-theme@gnome-shell-extensions.gcampax.github.com', 'blur-my-shell@aunetx', 'dash-to-dock@micxgx.gmail.com', 'appindicatorsupport@rgcjonas.gmail.com', 'just-perfection-desktop@just-perfection', 'rounded-window-corners@fxgn', 'space-bar@luchrioh', 'caffeine@patapon.info', 'clipboard-indicator@tudmotu.com', 'AlphabeticalAppGrid@stuarthayhurst', 'gpu-screen-recorder@dec05eba.com']
favorite-apps=['kitty.desktop', 'app.zen_browser.zen.desktop', 'firefox.desktop', 'org.gnome.Nautilus.desktop', 'antigravity.desktop', 'btop.desktop', 'org.gnome.Settings.desktop']

[shell/extensions/user-theme]
name='Matugen'

[shell/extensions/blur-my-shell]
brightness=0.68
power-saver=false
sigma=26

[shell/extensions/blur-my-shell/overview]
blur=true
style-components=3
workspace-corner-radius=20

[shell/extensions/blur-my-shell/panel]
blur=true
corner-radius=0
override-background=true
rounded-corners=0
static-blur=true
style-panel=0
unblur-in-overview=true

[shell/extensions/blur-my-shell/dash-to-dock]
blur=true
override-background=true
static-blur=false
style-dash-to-dock=2
unblur-in-overview=false

[shell/extensions/blur-my-shell/applications]
blur=false

[shell/extensions/blur-my-shell/popup]
blur=true
blur-behind-dialogs=true
blur-calendar=true
blur-dialogs=true
blur-menus=true
blur-notifications=true
blur-osds=true
blur-quick-settings=true
blur-screenshot=true
blur-submenus=true
blur-switchers=true
calendar-corner-radius=22
dialog-corner-radius=20
menu-corner-radius=20
notification-corner-radius=18
osd-corner-radius=22
override-background=true
preserve-shell-theme=true
quick-settings-corner-radius=26
screenshot-corner-radius=24
style-popup=3

[shell/extensions/dash-to-dock]
always-center-icons=false
apply-custom-theme=false
autohide=true
background-opacity=0.72
custom-background-color=true
custom-theme-customize-running-dots=true
custom-theme-shrink=true
dash-max-icon-size=40
dock-fixed=false
dock-position='BOTTOM'
extend-height=false
intellihide=true
intellihide-mode='FOCUS_APPLICATION_WINDOWS'
require-pressure-to-show=false
running-indicator-dominant-color=false
running-indicator-style='DOTS'
scroll-action='switch-workspace'
show-apps-at-top=false
show-mounts=false
show-running=true
show-trash=false
transparency-mode='FIXED'

[shell/extensions/just-perfection]
accessibility-menu=false
activities-button=false
animation=2
clock-menu-position=0
clock-menu-position-offset=0
keyboard-layout=false
notification-banner-position=2
panel=true
panel-button-padding-size=4
panel-indicator-padding-size=4
panel-size=34
power-icon=true
quick-settings=true
ripple-box=false
show-apps-button=true
startup-status=1
weather=false
window-demands-attention-focus=true
world-clock=false

[shell/extensions/rounded-window-corners-reborn]
border-width=1
keep-shadow-for-maximized-fullscreen=false
skip-libadwaita-app=true
skip-libhandy-app=false
tweak-kitty-terminal=true

[shell/extensions/space-bar/appearance]
active-workspace-border-radius=10
active-workspace-border-width=1
active-workspace-font-size=12
active-workspace-font-size-active=true
active-workspace-font-weight='700'
active-workspace-padding-h=10
active-workspace-padding-v=2
empty-workspace-border-radius=10
inactive-workspace-border-radius=10
inactive-workspace-border-width=1
inactive-workspace-font-size=12
inactive-workspace-font-size-active=true
inactive-workspace-padding-h=9
inactive-workspace-padding-v=2
workspace-margin=4
workspaces-bar-padding=4

[shell/extensions/space-bar/behavior]
always-show-numbers=false
indicator-style='workspaces-bar'
position='left'
position-index=0
scroll-wheel='panel'
show-empty-workspaces=false
smart-workspace-names=false
system-workspace-indicator=false
toggle-overview=true

[shell/extensions/caffeine]
indicator-position=2
restore-state=true
show-indicator='always'
show-notifications=false
show-timer=true

[shell/extensions/clipboard-indicator]
cache-images=true
display-mode=0
history-size=40
move-item-first=true
notify-on-copy=false
preview-size=30
strip-text=true
toggle-menu=['<Super>v']

[shell/extensions/alphabetical-app-grid]
folder-order-position='start'
sort-folder-contents=true
