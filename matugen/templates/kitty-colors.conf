# wallpaper palette injected directly into kitty ANSI registers (live-reloaded via SIGUSR1)
background {{ colors.surface.default.hex }}
foreground {{ colors.on_surface.default.hex }}
cursor {{ colors.primary.default.hex }}
cursor_text_color {{ colors.on_primary.default.hex }}
selection_background {{ colors.primary_container.default.hex }}
selection_foreground {{ colors.on_primary_container.default.hex }}
url_color {{ colors.primary.default.hex }}

# borders & tabs
active_border_color {{ colors.primary.default.hex }}
inactive_border_color {{ colors.outline_variant.default.hex }}
active_tab_background {{ colors.primary.default.hex }}
active_tab_foreground {{ colors.on_primary.default.hex }}
inactive_tab_background {{ colors.surface_container.default.hex }}
inactive_tab_foreground {{ colors.on_surface_variant.default.hex }}

# black & muted (outline works cleanly in both dark and light mode)
color0 {{ colors.surface.default.hex }}
color8 {{ colors.outline.default.hex }}

<* if {{is_dark_mode}} *>
# red (color1 calibrated so btop's 41m/97m selected row keeps crisp contrast, color9 vivid)
color1 {{ colors.error.default.hex | set_lightness: 46.0 }}
color9 {{ colors.error.default.hex }}

# green (dark-mode readable emerald)
color2 #8fd694
color10 #a6e3a1

# yellow (dark-mode warm amber)
color3 #e5c07b
color11 #f5d896
<* else *>
# red (light-mode coral-crimson balances 41m/97m selected row & error foregrounds)
color1 {{ colors.error.default.hex | set_lightness: 60.0 }}
color9 {{ colors.error.default.hex }}

# green (light-mode deep forest green for white paper contrast)
color2 #246b35
color10 #195427

# yellow (light-mode deep ochre for white paper contrast)
color3 #8c5600
color11 #6e4200
<* endif *>

# blue (primary)
color4 {{ colors.primary.default.hex }}
color12 {{ colors.primary.default.hex | auto_lightness: -12.0 }}

# magenta (tertiary)
color5 {{ colors.tertiary.default.hex }}
color13 {{ colors.tertiary.default.hex | auto_lightness: -12.0 }}

# cyan (secondary)
color6 {{ colors.secondary.default.hex }}
color14 {{ colors.secondary.default.hex | auto_lightness: -12.0 }}

# white (high-contrast foreground ink in both dark and light mode)
color7 {{ colors.on_surface.default.hex }}
<* if {{is_dark_mode}} *>
color15 {{ colors.on_surface.default.hex | auto_lightness: -6.0 }}
<* else *>
color15 {{ colors.on_surface.default.hex }}
<* endif *>

