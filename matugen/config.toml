[config]

[templates.hyprland]
input_path = "~/.config/matugen/templates/hyprland-colors.lua"
output_path = "~/.config/hypr/colors.lua"
post_hook = "$HOME/.config/matugen/post-hook-scripts/hyprland-colors-reload.zsh 2>/dev/null || true"

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/colors.conf"
# slap kitty awake
post_hook = "pkill -USR1 kitty 2>/dev/null || true"

[templates.fastfetch]
input_path = "~/.config/matugen/templates/fastfetch-colors.jsonc"
output_path = "~/.config/fastfetch/config.jsonc"

[templates.palette]
input_path = "~/.config/matugen/templates/palette.css"
output_path = "~/.config/quickshell/palette.css"

[templates.zsh]
input_path = "~/.config/matugen/templates/zsh-colors.zsh"
output_path = "~/.config/zsh/matugen.zsh"

# dump gtk4 palette into matugen.css (avoiding kde breeze clobbering colors.css)
[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk4.css"
output_path = "~/.config/gtk-4.0/matugen.css"

# dump gtk3 palette into matugen.css and execute the reload once both files exist
[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk3.css"
output_path = "~/.config/gtk-3.0/matugen.css"
post_hook = "$HOME/.config/matugen/post-hook-scripts/gtk-themes-reload.zsh 2>/dev/null || true"

[templates.nvim]
input_path = "~/.config/matugen/templates/nvim-colors.lua"
output_path = "~/.config/nvim/lua/config/colors.lua"

[templates.kde]
input_path = "~/.config/matugen/templates/kde-colors.colors"
output_path = "~/.local/share/color-schemes/Matugen.colors"
post_hook = "$HOME/.config/matugen/post-hook-scripts/qt-kde-theme-reload.zsh 2>/dev/null || true"
