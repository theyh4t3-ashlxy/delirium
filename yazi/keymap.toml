# ~/.config/yazi/keymap.toml

# 1. IJKL Navigation
[[manager.prepend_keymap]]
on   = "i"
run  = "arrow prev"
desc = "Move cursor up"

[[manager.prepend_keymap]]
on   = "k"
run  = "arrow next"
desc = "Move cursor down"

[[manager.prepend_keymap]]
on   = "j"
run  = "leave"
desc = "Back to parent directory"

[[manager.prepend_keymap]]
on   = "l"
run  = "enter"
desc = "Enter child directory"

# Preview scrolling
[[manager.prepend_keymap]]
on   = "I"
run  = "seek -5"
desc = "Seek up 5 lines in preview"

[[manager.prepend_keymap]]
on   = "K"
run  = "seek 5"
desc = "Seek down 5 lines in preview"

# Unbind old h so muscle memory forces ijkl
[[manager.prepend_keymap]]
on   = "h"
run  = "noop"
desc = "Unbound (use j for parent)"

# Tasks menu IJKL
[[tasks.prepend_keymap]]
on   = "i"
run  = "arrow prev"
desc = "Previous task"

[[tasks.prepend_keymap]]
on   = "k"
run  = "arrow next"
desc = "Next task"

# Select menu IJKL
[[select.prepend_keymap]]
on   = "i"
run  = "arrow prev"
desc = "Previous item"

[[select.prepend_keymap]]
on   = "k"
run  = "arrow next"
desc = "Next item"

# 2. Nautilus-style Enter (smart-enter plugin) & Backspace
[[manager.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter directory or open file"

[[manager.prepend_keymap]]
on   = "<Backspace>"
run  = "leave"
desc = "Go back to parent directory"

# 3. File Operations
[[manager.prepend_keymap]]
on   = "n"
run  = "create"
desc = "Create a new file or directory"

[[manager.prepend_keymap]]
on   = "r"
run  = "rename"
desc = "Rename selected file"

[[manager.prepend_keymap]]
on   = "d"
run  = "remove"
desc = "Move selected to trash"

# 4. Zoxide jump (replaces default 'z')
[[manager.prepend_keymap]]
on   = "z"
run  = "plugin zoxide"
desc = "Jump to directory via zoxide"
