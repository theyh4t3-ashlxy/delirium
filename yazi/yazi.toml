# ~/.config/yazi/yazi.toml

[manager]
ratio          = [1, 3, 4]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = true
show_symlink   = true

[preview]
tab_size        = 4
max_width       = 1000
max_height      = 1000
image_filter    = "lanczos3"
image_quality   = 85
sixel_fraction  = 15

[opener]
edit = [
    { run = 'nvim "$@"', block = true, desc = "Neovim" },
]
